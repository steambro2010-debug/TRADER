assistant:
  name: Jarvis
  wake_word: jarvis
  language: en
  response_style: concise_confident

models:
  llm:
    path: models/Qwen2.5-7B-Instruct-GPTQ-Int4
    backend: transformers
    max_new_tokens: 220
    temperature: 0.2
    top_p: 0.9
    gpu_layers: 64
  vlm:
    path: models/Qwen2.5-VL-7B-Instruct-GPTQ-Int4
    backend: transformers
    max_new_tokens: 280
  whisper:
    size: large-v3
    compute_type: float16
    device: cuda
  tts:
    model_name: tts_models/en/ljspeech/tacotron2-DDC
    use_cuda: true

runtime:
  loop_sleep_sec: 0.05
  wake_timeout_sec: 4
  confirmation_timeout_sec: 12
  screenshot_dir: logs/screenshots
  browser_headless: false
  tesseract_cmd: C:/Program Files/Tesseract-OCR/tesseract.exe
  allow_internet_research: true
  app_launch_paths:
    chrome: C:/Program Files/Google/Chrome/Application/chrome.exe
    edge: C:/Program Files (x86)/Microsoft/Edge/Application/msedge.exe

safety:
  emergency_stop_phrases:
    - jarvis stop immediately
    - stop immediately
    - emergency stop
  confirm_intents:
    medium:
      - move_file
      - rename_file
      - send_message
    high:
      - delete_path
      - overwrite_file
      - bulk_file_change
      - send_external_message

memory:
  db_path: logs/jarvis.db
  retention_days: 30
