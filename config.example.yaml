# Copy to config.yaml and adjust values
browser:
  url: "https://qxbroker.com/en/trade"
  user_data_dir: ".qxbroker_profile"
  channel: "chrome"
  viewport:
    width: 1400
    height: 900
  slow_mo_ms: 0
  security_wait_timeout_seconds: 300

chart:
  timeframe_seconds: 60
  max_candles: 120
  bullish_bgr_min: [20, 120, 20]
  bullish_bgr_max: [160, 255, 160]
  bearish_bgr_min: [20, 20, 120]
  bearish_bgr_max: [160, 160, 255]

prediction:
  min_confidence_alert: 75
  trend_lookback: 20
  support_resistance_lookback: 80

logging:
  enabled: true
  file: predictions_log.csv

ui:
  window_name: "Qxbroker CV Bot"
